name: Extract Adobe publication

on:
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install playwright pillow pypdf beautifulsoup4 requests
          python -m playwright install --with-deps chromium
      - name: Capture all pages and build PDF
        env:
          VIEW_URL: https://indd.adobe.com/view/8d12efb5-9748-416f-afbb-f654da4a59bb
          PACKAGE_BASE: https://indd.adobe.com/content/2/8d12efb5-9748-416f-afbb-f654da4a59bb/3570331580246/package/4ozb
          PAGE_COUNT: '32'
        run: python scripts/extract_adobe_publication.py
      - name: Upload complete publication
        uses: actions/upload-artifact@v4
        with:
          name: DCRO2026-complete-publication
          path: |
            output/DCRO2026-complete.pdf
            output/all-pages-text.txt
            output/pages/*.png
            output/pages/*.txt
            output/verification.json
          retention-days: 7
